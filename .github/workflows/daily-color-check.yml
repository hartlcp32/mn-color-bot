name: Daily MN Color Check

on:
  schedule:
    # Runs at 9:00 AM CST (3:00 PM UTC) every weekday
    - cron: '0 14 * * 1-5'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-color:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run color checker
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python mn_color_bot_github.py

    - name: Commit color history
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add mn_color_history.csv
        git diff --staged --quiet || git commit -m "Update color history - $(date +'%Y-%m-%d')"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main